spring.application.name=smartcatalog
spring.threads.virtual.enabled=true

# ----JWT configuration-----
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ----PostgreSQL datasource-----
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_db
spring.datasource.username=db_user
spring.datasource.password=db_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ----JPA / Hibernate-----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ----Flyway-----
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
# Reorder inserts to optimize batching (crucial for performance)
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ----Redis-----
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=your_password   # uncomment if Redis requires auth

# ----Spring AI / Gemini (native Gemini Developer API) -----
# Get a key at https://aistudio.google.com/app/apikey
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:MISSING}
# text-embedding-004 was shut down on 2026-01-14 (returns 404); gemini-embedding-001 replaces it.
# It defaults to 3072 dims, so request 768 to match the vector(768) column
# (pgvector's IVFFlat index cannot exceed 2000 dims anyway).
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# Link env file
spring.config.import=optional:file:.env[.properties]


