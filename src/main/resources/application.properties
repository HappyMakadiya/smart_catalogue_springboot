spring.application.name=smartcatalog
spring.threads.virtual.enabled=true

# JWT configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_db
spring.datasource.username=db_user
spring.datasource.password=db_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# update - add missing columns/tables on startup without dropping data
# validate - only validate schema (use in production after first run)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true